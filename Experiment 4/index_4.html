<!DOCTYPE html>
<html lang="eng">
    <head>
        <meta charset="UTF-8">
        <meta name="description" content="An online form for conveniently booking a hotel room at XYZ Hotel">
        <title> Hotel Room Booking Form </title>
    </head>
    <body>
        <h1 align="center"> Hotel Room Booking Form </h1>
        <form align="center">
            <label> Full Name: </label>
            <input type="text"> <br><br>
            <label> E-mail: </label>
            <input type="email"> <br><br>
            <label> Phone: </label>
            <input type="tel"> <br><br>
            <label> Check-in Date: </label>
            <input type="date"> <br><br>
            <label> Check-out Date: </label>
            <input type="date"> <br><br>
            <label> Room Type: </label>
            <select><option>Single Bed</option><option>Double Bed</option><option>Twin Bed</option>
                <option>Deluxe Room</option></select> <br><br>
            <label> Number of Guests: </label>
            <input type="number"> <br><br>
            <Label> Special Requests: </Label> <br>
            <textarea></textarea> <br><br>
            <button type="reset"> Reset Form </button> <button type="submit"> Book Now </button>
        </form>
    </body>
</html>
