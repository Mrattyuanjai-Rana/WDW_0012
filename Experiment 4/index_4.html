<!DOCTYPE html>
<html lang="eng">
    <head>
        <meta charset="UTF-8">
        <meta name="description" content="An online form for conveniently booking a hotel room at XYZ Hotel">
        <title> Hotel Room Booking Form </title>
    </head>
    <body>
        <h1 align="center"> Hotel Room Booking Form </h1>
        <form align="center" action="room_booked.html" method="get" autocomplete="on">
            <label for="full_name"> Full Name: </label>
            <input type="text" id="full_name" name="full_name" placeholder="ABC" required> <br><br>
            <label for="email"> E-mail: </label>
            <input type="email" id="email" name="user_email" placeholder="abc@~~~.com" required> <br><br>
            <label for="phone"> Phone: </label>
            <input type="tel" id="phone" name="user_phone" placeholder="+91xxxxxxxxxx" required> <br><br>
            <label for="checkin_date"> Check-in Date: </label>
            <input type="date" id="checkin_date" name="checkin_date" required> <br><br>
            <label for="checkout_date"> Check-out Date: </label>
            <input type="date" id="checkout_date" name="checkout_date" required> <br><br>
            <label for="roomtype"> Room Type: </label>
            <select id="roomtype" name="roomtype" placeholder="Select Your Room Type" required><option>Single Bed</option><option>Double Bed</option><option>Twin Bed</option>
                <option>Deluxe Room</option></select> <br><br>
            <label for="guest_count"> Number of Guests: </label>
            <input type="number" id="guest_count" name="guest_count" required> <br><br>
            <Label for="sp_req"> Special Requests: </Label> <br>
            <textarea id="sp_req" name="special_request"></textarea> <br><br>
            <button type="reset"> Reset Form </button> <button type="submit"> Book Now </button>
        </form>
    </body>
</html>
